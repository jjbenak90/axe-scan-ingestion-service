services:
  postgres:
    image: postgres:18-alpine
    container_name: axe-monitor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: axe_monitor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data: